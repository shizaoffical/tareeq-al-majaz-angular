<!-- Services -->
<div class="container">
    <div class="services-heading text-center">
      3 Easy step to book our service
    </div>
    <div class="slider-container">
      <div #slider class="slider" (click)="togglePause()">
        <div class="service" data-id="1">
          <span class="service-number">01</span>
          <span class="service-title">Advance Payment</span>
          <div class="service-content">We pay at the time of pickup.</div>
          <div class="service-icon">💳</div>
        </div>
        <div class="service active" data-id="2">
          <span class="service-number">02</span>
          <span class="service-title">24/7 Service</span>
          <div class="service-content">Available anytime.</div>
          <div class="service-icon">⏰</div>
        </div>
        <div class="service" data-id="3">
          <span class="service-number">03</span>
          <span class="service-title">Instant Follow-up</span>
          <div class="service-content">Quick response for queries.</div>
          <div class="service-icon">📞</div>
        </div>
      </div>
    </div>
  </div>
