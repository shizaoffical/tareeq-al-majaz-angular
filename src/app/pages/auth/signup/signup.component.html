<div class="auth-container">
    <div class="auth-card">
      <h2>Sign Up</h2>
      <form (ngSubmit)="onSignup()">
        <div class="mb-3">
          <input
            type="email"
            class="form-control"
            placeholder="Enter your email"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>
  
        <div class="mb-3">
          <input
            type="password"
            class="form-control"
            placeholder="Create a password"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>
  
        <button type="submit">Sign Up</button>
      </form>
  
      <div class="auth-footer">
        <p>
          Already have an account?
          <a routerLink="/login">Login</a>
        </p>
      </div>
    </div>
  </div>
