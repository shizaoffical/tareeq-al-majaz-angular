<div class="auth-container">
    <div class="auth-card">
      <h2>Login</h2>
      <form (ngSubmit)="onLogin()">
        <div class="mb-3">
          <input
            type="email"
            class="form-control"
            placeholder="Enter your email"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>
  
        <div class="mb-3">
          <input
            type="password"
            class="form-control"
            placeholder="Enter your password"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>
  
        <button type="submit">Login</button>
      </form>
  
      <div class="auth-footer">
        <p>
          Don’t have an account?
          <a routerLink="/signup">Sign Up</a>
        </p>
      </div>
    </div>
  </div>
